[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gimp-plugin-comfyui"
dynamic = ["version"]
description = "GIMP 3 plug-in for batch image processing with ComfyUI"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "comfyui_plugin.__version__"}

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "integration: requires installed GIMP and a running ComfyUI server",
]